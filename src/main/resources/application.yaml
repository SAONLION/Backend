spring:
  application:
    name: mcmAI

  config:
    import: optional:application-local.yaml

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  management:
    endpoints:
      web:
        exposure:
          include: health

app:
  internal-test-endpoints:
    enabled: false