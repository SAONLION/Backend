name: Deploy to EC2 via ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: deploy-repository
  EC2_DEPLOY_PATH: ~/mcmai-deploy

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Gradle 빌드 (테스트 포함) — 여기서 실패하면 Docker/ECR/배포 단계는 아예 실행되지 않음
      - name: Gradle Build
        run: ./gradlew clean build -x test

      # 2. Docker 이미지 빌드
      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Docker Build
        run: docker build -t app:${{ steps.vars.outputs.IMAGE_TAG }} .

      # 3. AWS 인증 + ECR 로그인
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. ECR push (latest + 커밋 SHA 태그, 롤백 대비)
      - name: Tag & Push image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          docker tag app:${IMAGE_TAG} ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker tag app:${IMAGE_TAG} ${REGISTRY}/${ECR_REPOSITORY}:latest
          docker push ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${ECR_REPOSITORY}:latest

      # 5. EC2 SSH 접속 후 재배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "===> [1/5] ECR 로그인"
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}

            echo "===> [2/5] 배포 디렉토리 이동"
            cd ${{ env.EC2_DEPLOY_PATH }}

            echo "===> [3/5] 최신 이미지 pull"
            docker compose pull

            echo "===> [4/5] 기존 컨테이너 종료"
            docker compose down

            echo "===> [5/5] 신규 컨테이너 기동"
            docker compose up -d

            echo "===> 정리: 사용하지 않는 이미지 삭제"
            docker image prune -f

            echo "===> 배포 완료: $(docker compose ps)"